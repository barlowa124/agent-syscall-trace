[package]
name = "astrace"
version = "0.1.0"
edition = "2021"
description = "Process-tree tracer with signed manifests, hash-chained receipts, and netns flow capture"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
